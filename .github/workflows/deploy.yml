name: Build and Deploy

on:
  push:
    branches: [main]
  # Reconstruir y desplegar desde GitHub (Actions > Build and Deploy > Run workflow) sin hacer un
  # commit. Solo despliega desde main (ver los `if` de los jobs).
  workflow_dispatch:

# El nombre de la imagen se calcula en minusculas en el job de build: Docker rechaza nombres con
# mayusculas y la organizacion se llama "GoAgendaIA" (github.repository = "GoAgendaIA/...").

jobs:
  build-and-push:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Nombre de la imagen (ghcr.io/<owner>/<repo> en minusculas)
        run: echo "IMAGE_NAME=ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    # Un deploy normal tarda ~1 min. Si algo se cuelga en el VPS (un pull que no avanza), se corta aqui en vez de gastar
    # minutos de Actions durante horas (el limite por defecto de un job es 6 h).
    timeout-minutes: 8
    if: github.ref == 'refs/heads/main'
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Instalar cloudflared
        run: |
          curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/

      - name: Deploy por SSH via tunel de Cloudflare
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cat >> ~/.ssh/config << EOF
          Host goagenda
            HostName $SSH_HOST
            User $SSH_USER
            IdentityFile ~/.ssh/id_ed25519
            ProxyCommand cloudflared access ssh --hostname %h
            StrictHostKeyChecking no
            ServerAliveInterval 15
            ServerAliveCountMax 4
          EOF
          # El pull puede fallar de forma transitoria en el daemon del VPS
          # ("failed to lease content: NotFound"); se reintenta antes de rendirse.
          ssh goagenda 'cd /opt/goagenda/frontend && for intento in 1 2 3; do timeout 240 docker compose pull && break; echo "pull fallo (intento $intento/3), reintentando en 15s"; [ "$intento" = 3 ] && exit 1; sleep 15; done && docker compose up -d --remove-orphans && docker image prune -f'
